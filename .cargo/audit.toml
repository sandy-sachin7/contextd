[advisories]
ignore = []
informational_warnings = ["notice", "unmaintained"]
severity_threshold = "low"

[database]
fetch = true
stale = false

[output]
deny = []
format = "terminal"
quiet = false
show_tree = true

[target]
arch = ["x86_64", "aarch64"]
os = ["linux", "macos", "windows"]

[yanked]
enabled = true
update_index = true
