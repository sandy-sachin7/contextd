name: Security Audit

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
  pull_request:
    paths:
      - '**/Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/audit.toml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
