name: Yank deprecated crate version

on:
  workflow_dispatch:
    inputs:
      version:
        description: contextd version to yank
        required: true
        type: string
        default: "4.0.1"

permissions:
  contents: read

jobs:
  yank:
    runs-on: ubuntu-latest
    steps:
      - uses: dtolnay/rust-toolchain@stable

      - name: Yank version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          YANK_VERSION: ${{ inputs.version }}
        run: cargo yank contextd --version "$YANK_VERSION" --token "$CARGO_REGISTRY_TOKEN"
