name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      - name: Run unit tests
        run: cargo test --lib --bins --verbose

      - name: Run integration tests
        run: cargo test --tests --verbose

      - name: Run doc tests
        run: cargo test --doc --locked --verbose

      - name: Compile benchmarks
        run: cargo test --benches --no-run

  test-platforms:
    name: Test · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --verbose

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Verify Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  retrieval-regression:
    name: Retrieval Quality Gate (Q8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Cache Q8 ONNX model
        uses: actions/cache@v4
        with:
          path: ~/.local/share/contextd/models
          key: contextd-model-all-minilm-l6-v2-q8-v1

      - name: Ensure ripgrep is installed
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y ripgrep
          fi

      - name: Build release binary
        run: cargo build --release --locked

      - name: Run retrieval regression gate
        run: |
          python3 scripts/eval_retrieval.py \
            --model all-minilm-l6-v2-q8 \
            --auto-setup \
            --min-mrr 0.80 \
            --min-ndcg 0.82 \
            --min-semantic-mrr 0.60 \
            --require-beat-ripgrep
