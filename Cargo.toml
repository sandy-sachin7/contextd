[package]
name = "contextd"
version = "4.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Santhosh Sachin"]
description = "A local-first, semantic context daemon for AI agents."
license = "MIT"
documentation = "https://sandy-sachin7.github.io/contextd/"
repository = "https://github.com/sandy-sachin7/contextd"
readme = "README.md"
keywords = ["mcp", "semantic-search", "rag", "embeddings", "sqlite"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
rusqlite = { version = "0.42", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.37"
notify = "8.2.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"
axum = "0.7"
tower = { version = "0.4", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.5", features = ["limit", "timeout"] }
# Pinned: ort-sys 2.0.0-rc.15 dropped x86_64-apple-darwin prebuilt ONNX Runtime
# binaries, which breaks the Intel macOS release target. rc.10 still ships them.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["ndarray", "download-binaries", "std", "tracing"] }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
pdf-extract = "0.12"
toml = "0.9.8"
toml_edit = "0.22"
notify-debouncer-mini = "0.7.0"
ignore = "0.4.25"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
indicatif = "0.17"
futures-util = "0.3"
sqlite-vec = "0.1.9"
dirs = "6.0"
blake3 = "1.5"
sha2 = "0.10"
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
http-body-util = "0.1"

[[bench]]
name = "chunker_bench"
harness = false

[[bench]]
name = "db_bench"
harness = false
