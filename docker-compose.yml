services:
  contextd:
    build: .
    image: ghcr.io/sandy-sachin7/contextd:latest
    container_name: contextd
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      # Mount your workspace for indexing
      - ./:/workspace:ro
      # Persistent storage for database
      - contextd-data:/app/data
      # Models directory (download once, reuse)
      - contextd-models:/app/models
    environment:
      - CONTEXTD_HOST=0.0.0.0
      - CONTEXTD_PORT=3030
      - CONTEXTD_DB_PATH=/app/data/contextd.db
      - CONTEXTD_MODEL_PATH=/app/models
      - CONTEXTD_WATCH_PATHS=/workspace
      # Required when binding to 0.0.0.0; override in production!
      - CONTEXTD_AUTH_TOKEN=${CONTEXTD_AUTH_TOKEN:-change-me-before-exposing}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3030/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  contextd-data:
  contextd-models:
